services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: roulette-backend
    restart: unless-stopped
    networks:
      - roulette-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # args:
      #   VITE_WS_URL: ws://localhost:8080/api/game_ws
      #   VITE_DEFAULT_TABLE: main-table
    container_name: roulette-frontend
    restart: unless-stopped
    networks:
      - roulette-network

  nginx:
    image: nginx:alpine
    container_name: roulette-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - roulette-network

networks:
  roulette-network:
    driver: bridge
